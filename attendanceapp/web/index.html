<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="Attendance App - Face Recognition System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="attendanceapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>attendanceapp</title>
  <link rel="manifest" href="manifest.json">

  <!-- ✅ face-api.js -->
  <script src="js/face-api.min.js"></script>

  <!-- ✅ Preload face-api.js models -->
  <script>
    (async function () {
      console.log("🧠 Initializing face-api.js models...");
      if (typeof faceapi === "undefined") {
        console.error("❌ face-api.js not found!");
        return;
      }

      const modelPath = window.location.origin + window.location.pathname.replace(/index\.html$/, '') + "models/";
      try {
        console.time("[face-api] loadModels");
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(modelPath),
          faceapi.nets.faceLandmark68Net.loadFromUri(modelPath),
          faceapi.nets.faceRecognitionNet.loadFromUri(modelPath),
          faceapi.nets.tinyFaceDetector.loadFromUri(modelPath),
        ]);
        console.timeEnd("[face-api] loadModels");
        window.faceApiModelsLoaded = true;
        window.dispatchEvent(new Event("faceApiModelsReady"));
        console.log("✅ face-api.js models loaded from:", modelPath);
      } catch (err) {
        console.error("⚠️ face-api.js model load failed:", err);
      }
    })();
  </script>

  <!-- ✅ Load Firebase SDKs only (no config here) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-storage.js"></script>
</head>

<body>
<script src="flutter_bootstrap.js" defer></script>

<!-- Simple loader -->
<script>
  const loadingDiv = document.createElement("div");
  loadingDiv.innerHTML = `
    <div id="fallback" style="display:flex;flex-direction:column;align-items:center;
    justify-content:center;height:100vh;font-family:sans-serif;">
      <p style="font-size:18px;">🚀 Loading app...</p>
    </div>`;
  document.body.appendChild(loadingDiv);

  const timeout = setTimeout(() => {
    document.getElementById("fallback").innerHTML = `
      <p>⚠️ App failed to load.</p>
      <button onclick="window.location.reload(true)">🔄 Reload</button>`;
  }, 10000);

  window.addEventListener('flutter-first-frame', () => {
    clearTimeout(timeout);
    loadingDiv.remove();
  });
</script>

<!-- Error monitor -->
<script>
  window.addEventListener('error', e =>
    console.error('🌋 Global error:', e.message, e.filename, e.lineno)
  );
  window.addEventListener('unhandledrejection', e =>
    console.error('💥 Unhandled promise rejection:', e.reason)
  );
</script>

<!-- Optional Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service_worker.js')
      .then(r => console.log("✅ SW registered:", r.scope))
      .catch(err => console.warn("⚠️ SW failed:", err));
  }
</script>
</body>
</html>
