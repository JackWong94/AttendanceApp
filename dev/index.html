<!DOCTYPE html>
<html>
<head>
  <base href="/AttendanceApp/dev/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Attendance App - Face Recognition System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="attendanceapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>attendanceapp</title>
  <link rel="manifest" href="manifest.json">

  <!-- ✅ face-api.js -->
  <script src="js/face-api.min.js"></script>

  <!-- ✅ Preload face-api.js models -->
  <script>
    (async function () {
      console.log("🧠 Initializing face-api.js model loader...");

      if (typeof faceapi === "undefined") {
        console.error("❌ face-api.js not found! Ensure js/face-api.min.js is accessible.");
        return;
      }

      // 👇 FIXED: use pathname, not origin (works for GitHub Pages subfolder)
      const modelPath = window.location.origin + window.location.pathname.replace(/index\.html$/, '') + "models/";
      try {
        console.time("[face-api] loadModels");
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(modelPath),
          faceapi.nets.faceLandmark68Net.loadFromUri(modelPath),
          faceapi.nets.faceRecognitionNet.loadFromUri(modelPath),
          faceapi.nets.tinyFaceDetector.loadFromUri(modelPath),
        ]);
        console.timeEnd("[face-api] loadModels");

        window.faceApiModelsLoaded = true;
        window.dispatchEvent(new Event("faceApiModelsReady"));
        console.log("✅ face-api.js models fully loaded from:", modelPath);
      } catch (err) {
        console.error("⚠️ Failed to load face-api.js models:", err);
        window.location.reload(true);
      }
    })();
  </script>
  <script>
    //Warn on reload & exit
    window.addEventListener("beforeunload", (event) => {
      event.preventDefault();
      event.returnValue = "";
    });

    //Warn on pop back
    window.addEventListener("load", () => {
      // Handle back button
      window.onpopstate = function () {
        const stay = confirm("Are you sure you want to leave this page?");
        if (stay) {
          history.pushState(null, "", location.href);
        } else {
          history.back();
        }
      };
    });
  </script>
</head>

<body>
<!-- ✅ Flutter app entry -->
<script src="flutter_bootstrap.js" defer></script>
</body>
</html>
